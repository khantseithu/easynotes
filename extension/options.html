<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>EasyNotes settings</title>
<link rel="stylesheet" href="sidepanel.css">
<style>
  body { max-width: 560px; margin: 0 auto; padding: 40px 24px; }
  label { display: block; font-weight: 600; margin: 24px 0 6px; }
  .row { display: flex; gap: 8px; }
  .row input { flex: 1; min-width: 0; height: 38px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--raised); }
  .row input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  p { color: var(--muted); line-height: 1.55; }
  code { font-size: 12.5px; background: var(--hover); padding: 2px 6px; border-radius: 5px; }
</style>
</head>
<body>
<div class="brand"><img src="icons/icon-32.png" alt="" width="26" height="26"><span>Easy<b>Notes</b> settings</span></div>
<form id="form">
  <label for="server">Server address</label>
  <div class="row"><input id="server" type="url" placeholder="http://127.0.0.1:8765" spellcheck="false"><button class="btn primary">Save</button></div>
  <p>The address of the EasyNotes server that <code>python3 ytnotes.py</code> starts. The default is <code>http://127.0.0.1:8765</code>.
     For a server on another computer, start it with <code>--lan</code> and use the address it shows. Chrome asks you to allow that address.</p>
  <p class="msg" id="msg" aria-live="polite"></p>
</form>
<script type="module" src="options.js"></script>
</body>
</html>
