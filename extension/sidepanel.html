<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>YT Notes</title>
<link rel="stylesheet" href="sidepanel.css">
</head>
<body>
<header class="head">
  <button class="icon-btn" id="back" aria-label="Back to library" hidden>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
  </button>
  <div class="brand"><img src="icons/icon-32.png" alt=""><span>YT <b>Notes</b></span></div>
  <button class="icon-btn" id="library" aria-label="Library">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
  </button>
  <a class="icon-btn" id="open-app" target="_blank" rel="noopener" aria-label="Open the YT Notes app" title="Open the YT Notes app">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
  </a>
  <button class="icon-btn" id="settings" aria-label="Settings" title="Settings">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</header>
<main id="view" aria-live="polite"></main>

<div class="player" id="player" role="region" aria-label="Audio player">
  <button class="p-play" id="p-play" aria-label="Play"></button>
  <div class="p-mid">
    <button class="p-title" id="p-title"></button>
    <div class="p-bar">
      <span id="p-cur">0:00</span>
      <input type="range" id="p-seek" min="0" max="100" step="0.1" value="0" aria-label="Seek">
      <span id="p-dur">0:00</span>
    </div>
  </div>
  <button class="p-speed" id="p-speed" aria-label="Playback speed">1×</button>
  <button class="icon-btn" id="p-close" aria-label="Close player">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
</div>
<audio id="audio" preload="metadata"></audio>
<div class="pop" id="pop" role="tooltip"></div>

<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>
<script type="module" src="sidepanel.js"></script>
</body>
</html>
