<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#faf8f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#23201c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EasyNotes">
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<title>Sign in · EasyNotes</title>
<style>
:root {
  --bg: oklch(0.985 0.006 80);
  --raised: oklch(0.995 0.004 80);
  --line: oklch(0.895 0.01 80);
  --text: oklch(0.25 0.012 70);
  --muted: oklch(0.5 0.012 70);
  --accent: oklch(0.47 0.14 267);
  --accent-ink: oklch(0.985 0.006 268);
  --accent-soft: oklch(0.935 0.035 268);
  --danger: oklch(0.53 0.17 27);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: oklch(0.2 0.008 70);
    --raised: oklch(0.235 0.009 70);
    --line: oklch(0.3 0.01 70);
    --text: oklch(0.87 0.012 80);
    --muted: oklch(0.67 0.012 75);
    --accent: oklch(0.76 0.09 272);
    --accent-ink: oklch(0.2 0.02 268);
    --accent-soft: oklch(0.3 0.045 268);
    --danger: oklch(0.72 0.14 27);
  }
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--text);
       font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
main { width: 100%; max-width: 340px; }
img { width: 56px; height: 56px; display: block; margin-bottom: 20px; }
h1 { font-size: 24px; letter-spacing: -0.02em; margin: 0 0 8px; }
p { color: var(--muted); margin: 0 0 20px; }
label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
input { width: 100%; height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--raised); color: var(--text); font: inherit; font-size: 16px; outline: none; }
input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
input:focus-visible { outline: none; }
button { width: 100%; height: 44px; margin-top: 12px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 600; cursor: pointer; }
button:disabled { opacity: .6; cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.err { color: var(--danger); font-size: 13.5px; margin: 10px 0 0; min-height: 1.5em; }
</style>
</head>
<body>
<main>
  <img src="/assets/icon.svg" alt="">
  <h1>Sign in to EasyNotes</h1>
  <p>Enter the password that you set when you started the server.</p>
  <form id="f">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required autofocus>
    <button id="go">Sign in</button>
    <p class="err" id="err" role="alert"></p>
  </form>
</main>
<script>
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const go = document.getElementById("go"), err = document.getElementById("err");
  go.disabled = true; err.textContent = "";
  try {
    const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: document.getElementById("pw").value }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || r.statusText);
    location.reload();
  } catch (x) {
    err.textContent = x.message;
    go.disabled = false;
  }
});
</script>
</body>
</html>
